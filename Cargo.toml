[package]
name = "silkworm-rs"
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Async-first web scraping framework (Rust port)"
repository = "https://github.com/RustedBytes/silkworm"
homepage = "https://github.com/RustedBytes/silkworm"
documentation = "https://docs.rs/silkworm"
readme = "README.md"
keywords = ["web", "scraping", "crawler", "spider", "async"]
categories = ["web-programming", "web-programming::http-client"]

[lib]
name = "silkworm"
path = "src/lib.rs"

[[bench]]
name = "core"
harness = false
required-features = ["xpath"]

[[bench]]
name = "item_accounting"
harness = false

[[bench]]
name = "seen_requests"
harness = false

[[bench]]
name = "url_params"
harness = false

[[bench]]
name = "csv_rows"
harness = false

[[example]]
name = "quotes_spider_xpath"
required-features = ["xpath"]

[[example]]
name = "url_titles_spider"
required-features = ["cli-examples"]

[[example]]
name = "export_formats_demo"
required-features = ["cli-examples"]

[[example]]
name = "hackernews_spider"
required-features = ["cli-examples"]

[[example]]
name = "lobsters_spider"
required-features = ["cli-examples"]

[[example]]
name = "sitemap_spider"
required-features = ["cli-examples"]

[dependencies]
charset-norm = { version = "4.1.0", optional = true }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
encoding_rs = "0.8.42"
http-body-util = "0.1.5"
rand = "0.10.3"
regex = "1.13.1"
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["tokio-rt", "json", "gzip", "brotli", "deflate", "webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

scraper = "0.27.0"

xee-xpath = { version = "0.1.5", optional = true }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
url = "2.5.8"
thiserror = "2.0.21"
fasttime = "0.3.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[features]
default = ["scraper-atomic"]
scraper-atomic = ["scraper/atomic"]
xpath = ["dep:xee-xpath"]
cli-examples = ["dep:clap"]
# charset-norm requires Rust 1.98; the default feature set retains MSRV 1.92.
charset-detection = ["dep:charset-norm"]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "rayon", "html_reports"] }

[[bench]]
name = "criterion_api"
harness = false

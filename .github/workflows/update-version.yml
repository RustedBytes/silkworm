name: Update version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer component (ignored when version is supplied)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Optional explicit MAJOR.MINOR.PATCH version, without v
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-version
  cancel-in-progress: false

jobs:
  update-version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"
      - name: Prepare synchronized versions
        id: version
        env:
          VERSION_BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: python .github/scripts/bump_version.py --bump "$VERSION_BUMP" --version "$EXPLICIT_VERSION"
      - name: Verify metadata and diff
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --check
      - name: Create version PR and run CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="chore/version-$NEW_VERSION"
          git ls-remote origin "refs/heads/$branch" "refs/tags/v$NEW_VERSION" > /tmp/version-refs
          if test -s /tmp/version-refs; then
            echo "Version branch or tag already exists: $NEW_VERSION" >&2
            exit 1
          fi
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Synchronizes Cargo.toml and Cargo.lock. Package metadata passed validation. The Tests workflow is explicitly dispatched for this branch."
          gh workflow run test.yml --ref "$branch"

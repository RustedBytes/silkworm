name: Parser evaluation

on:
  pull_request:
    paths:
      - 'tools/parser-evaluation/**'
      - 'docs/parser-evaluation.md'
      - '.github/workflows/parser-evaluation.yml'
  push:
    branches: [master]
    paths:
      - 'tools/parser-evaluation/**'
      - 'docs/parser-evaluation.md'
      - '.github/workflows/parser-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/parser-evaluation -> target
      - run: cargo fmt --manifest-path tools/parser-evaluation/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path tools/parser-evaluation/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/parser-evaluation/Cargo.toml --all-targets -- -D warnings
      - run: cargo bench --locked --manifest-path tools/parser-evaluation/Cargo.toml --bench parsers -- --test

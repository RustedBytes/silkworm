name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: "Run selector/scheduler benchmarks with regression thresholds"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run baseline tests
        run: cargo test --all

      - name: Run features compatible with MSRV
        run: cargo test --features xpath,cli-examples

      - name: Run no-default-features tests
        run: cargo test --no-default-features

      - name: Run examples in offline mock mode
        run: ./scripts/run_examples_offline.sh

      - name: Verify documentation and Markdown examples
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --locked --no-deps --features xpath,cli-examples
          cargo test --locked --doc --features xpath,cli-examples
          python3 scripts/check_docs.py

      - name: Run clippy
        run: cargo clippy --all-targets --features xpath,cli-examples -- -D warnings

  charset-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.98"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test charset detection with all features
        run: cargo test --locked --all-features
      - name: Test detection without DOM caching
        run: cargo test --locked --no-default-features --features charset-detection
      - name: Lint all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  benchmark:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_benchmarks == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.92"
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run benchmark regression checks
        env:
          SILKWORM_BENCH_CHECK: "1"
        run: cargo bench --bench core --features xpath

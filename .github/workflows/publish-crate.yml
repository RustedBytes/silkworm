name: Publish crate

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install Rust
        run: rustup update stable --no-self-update

      - name: Install version editor
        run: cargo +stable install cargo-edit --locked

      - name: Set version from release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          # cargo set-version перевіряє коректність SemVer.
          cargo +stable set-version "$VERSION"

      - name: Test
        run: cargo +stable test --locked

      - name: Check package
        run: cargo +stable publish --dry-run --locked --allow-dirty

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked --allow-dirty
